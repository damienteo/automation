name: Daily News Digest

on:
  workflow_dispatch:
  # Optional: Automatically runs daily at 7:00 AM Tokyo Time (22:00 UTC previous day)
  # schedule:
  #   - cron: '0 22 * * *'

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Full Article & Translate in Chunks
        id: process_news
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python3 - << 'PY_EOF'
          import urllib.request, json, html, sys, os, time
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          api_key = os.environ.get("AI_API_KEY")
          if not api_key:
              sys.stderr.write("::error::AI_API_KEY secret is missing or empty!\n")
              sys.exit(1)

          class BBCArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paragraphs = []
                  self.in_p = False
                  self.in_article = False
                  self.curr = []

              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == "article" or d.get("role") == "main":
                      self.in_article = True
                  if tag == "p" and self.in_article:
                      self.in_p = True
                      self.curr = []

              def handle_endtag(self, tag):
                  if tag == "p" and self.in_p:
                      self.in_p = False
                      t = "".join(self.curr).strip()
                      # Filter out non-article boilerplate (video player labels, ads, captions)
                      if len(t) > 30 and not any(t.startswith(x) for x in ["Watch:", "Listen to", "This video", "Image source", "Published"]):
                          self.paragraphs.append(html.unescape(t))
                  if tag == "article":
                      self.in_article = False

              def handle_data(self, data):
                  if self.in_p:
                      self.curr.append(data)

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) NewsDigestBot/1.0"}

          # 1. Fetch RSS for top headline & link
          rss_req = urllib.request.Request("https://feeds.bbci.co.uk/news/world/rss.xml", headers=headers)
          with urllib.request.urlopen(rss_req) as resp:
              root = ET.fromstring(resp.read())
          item = root.find(".//channel/item")
          title = html.unescape(item.find("title").text.strip())
          link = item.find("link").text.strip()

          # 2. Fetch full article HTML and extract paragraphs
          art_req = urllib.request.Request(link, headers=headers)
          with urllib.request.urlopen(art_req) as resp2:
              html_content = resp2.read().decode("utf-8", errors="ignore")

          parser = BBCArticleParser()
          parser.feed(html_content)
          paragraphs = parser.paragraphs

          print(f"Scraped {len(paragraphs)} paragraphs from BBC article.")

          # 3. Translate in chunks of 4 paragraphs (guarantees 100% full article coverage without truncation)
          chunk_size = 4
          translated_sections = []
          gemini_url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"

          total_chunks = (len(paragraphs) + chunk_size - 1) // chunk_size

          for idx, i in enumerate(range(0, len(paragraphs), chunk_size)):
              chunk_text = "\n\n".join(paragraphs[i:i + chunk_size])
              prompt = (
                  "Break down the following news excerpt sentence by sentence.\n"
                  "For EVERY sentence, provide:\n"
                  "1. EN: [Original English sentence]\n"
                  "2. ZH: [Mandarin Chinese translation]\n"
                  "3. PY: [Hanyu Pinyin with tone marks]\n"
                  "4. JA: [Natural Japanese translation]\n"
                  "5. RM: [Hepburn Romaji pronunciation]\n\n"
                  f"Excerpt:\n{chunk_text}\n\n"
                  "Rules:\n"
                  "- Translate every sentence completely.\n"
                  "- Output clean line-by-line text without conversational remarks."
              )

              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "maxOutputTokens": 8192,
                      "thinkingConfig": {"thinkingLevel": "MINIMAL"}
                  }
              }

              req = urllib.request.Request(
                  gemini_url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key
                  }
              )

              try:
                  with urllib.request.urlopen(req) as resp:
                      res_json = json.loads(resp.read().decode("utf-8"))
                      part_text = res_json["candidates"][0]["content"]["parts"][0]["text"]
                      translated_sections.append(part_text.strip())
                      print(f"Processed chunk {idx + 1} of {total_chunks}")
              except Exception as e:
                  print(f"Error on chunk {idx + 1}: {e}")

              # Respect free tier rate limits
              time.sleep(1)

          full_content = "\n\n---\n\n".join(translated_sections)
          today_date = time.strftime("%A, %B %d, %Y")

          email_body = (
              f"📰 DAILY NEWS DIGEST ({today_date})\n"
              f"Title: {title}\n"
              f"Original Article: {link}\n\n"
              f"========================================\n"
              f"{full_content}\n"
              f"========================================\n\n"
              f"Have a great day!"
          )

          # Export into GITHUB_ENV with a safe unique delimiter
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TODAY_DATE={today_date}\n")
              delim = "DELIM_" + str(int(time.time()))
              f.write(f"EMAIL_BODY<<{delim}\n{email_body}\n{delim}\n")

          print("Successfully compiled full article email body!")
          PY_EOF

      - name: Send Email Digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.USER_EMAIL }}
          password: ${{ secrets.EMAIL_APP_PW }}
          subject: "📰 Daily News Line-by-Line Breakdown (${{ env.TODAY_DATE }})"
          to: ${{ secrets.USER_EMAIL }}
          from: "News Digest Bot"
          body: ${{ env.EMAIL_BODY }}
