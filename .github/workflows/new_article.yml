name: Daily News Digest

on:
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch News and Generate Breakdown
        id: process_news
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # 1. Fetch top headline from BBC News RSS feed (with User-Agent)
          RSS_DATA=$(curl -fsSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) NewsDigest/1.0" "https://feeds.bbci.co.uk/news/world/rss.xml")

          # Parse XML elements cleanly using Python (one-line prevents YAML indentation errors)
          NEWS_JSON=$(python3 -c "import xml.etree.ElementTree as ET, json, sys, html; root = ET.fromstring(sys.stdin.read()); item = root.find('.//channel/item'); clean = lambda t: html.unescape(item.find(t).text.strip()) if item is not None and item.find(t) is not None and item.find(t).text else ''; print(json.dumps({'title': clean('title'), 'description': clean('description'), 'link': clean('link')}))" <<< "$RSS_DATA")

          TITLE=$(echo "$NEWS_JSON" | jq -r '.title')
          DESCRIPTION=$(echo "$NEWS_JSON" | jq -r '.description')
          ARTICLE_LINK=$(echo "$NEWS_JSON" | jq -r '.link')

          TODAY_DATE=$(TZ="Asia/Tokyo" date +'%A, %B %d, %Y')

          # 2. Construct Prompt for Gemini API
          PROMPT=$(cat <<EOF
          Analyze the following news item:
          Title: $TITLE
          Summary: $DESCRIPTION

          Break down the text sentence by sentence. For EVERY sentence, provide:
          1. EN: [Original English sentence]
          2. ZH: [Mandarin Chinese translation]
          3. PY: [Hanyu Pinyin with tone marks]
          4. JA: [Natural Japanese translation]
          5. RM: [Hepburn Romaji pronunciation]

          Keep the output in clear plain text, structured clearly per sentence.
          EOF
          )

          # Escape prompt payload safely into JSON using jq
          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{
              parts: [{ text: $prompt }]
            }]
          }')

          # 3. Call latest Gemini 3.8 Flash endpoint with error verification
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${AI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          # Check for API error status (e.g. rate limit, bad key)
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$API_ERROR" ]; then
            echo "::error::Gemini API call failed: $API_ERROR"
            exit 1
          fi

          PARSED_CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -z "$PARSED_CONTENT" ]; then
            echo "::error::Gemini returned empty or blocked content."
            exit 1
          fi

          # 4. Construct Email Body
          BODY=$(cat <<EOF
          📰 DAILY NEWS DIGEST ($TODAY_DATE)
          Original Article: $ARTICLE_LINK

          ========================================
          $PARSED_CONTENT
          ========================================

          Have a great day!
          EOF
          )

          # Export variables with collision-proof delimiter
          EOF_DELIM=$(openssl rand -hex 8)
          echo "TODAY_DATE=$TODAY_DATE" >> $GITHUB_ENV
          {
            echo "EMAIL_BODY<<$EOF_DELIM"
            echo "$BODY"
            echo "$EOF_DELIM"
          } >> $GITHUB_ENV

      - name: Send Email Digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.USER_EMAIL }}
          password: ${{ secrets.EMAIL_APP_PW }}
          subject: "📰 Daily News Line-by-Line Breakdown (${{ env.TODAY_DATE }})"
          to: ${{ secrets.USER_EMAIL }}
          from: "News Digest Bot"
          body: ${{ env.EMAIL_BODY }}
