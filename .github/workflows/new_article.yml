name: Daily News Digest

on:
  workflow_dispatch:
  # Optional: Runs daily at 7:00 AM Tokyo Time (22:00 UTC previous day)
  # schedule:
  #   - cron: '0 22 * * *'

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Full Article & Generate Line-by-Line Breakdown
        id: process_news
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # 1. Fetch RSS and scrape FULL article text using Python (zero extra dependencies)
          python3 - << 'PY_EOF' > /tmp/news.json
          import urllib.request, json, html, sys
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          class BBCArticleParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paragraphs = []
                  self.in_p = False
                  self.in_article = False
                  self.curr = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == 'article' or d.get('role') == 'main':
                      self.in_article = True
                  if tag == 'p' and self.in_article:
                      self.in_p = True
                      self.curr = []
              def handle_endtag(self, tag):
                  if tag == 'p' and self.in_p:
                      self.in_p = False
                      t = ''.join(self.curr).strip()
                      # Filter non-article boilerplate (video player labels, captions, ads)
                      if len(t) > 30 and not any(t.startswith(x) for x in ['Watch:', 'Listen to', 'This video', 'Image source', 'Published']):
                          self.paragraphs.append(html.unescape(t))
                  if tag == 'article':
                      self.in_article = False
              def handle_data(self, data):
                  if self.in_p:
                      self.curr.append(data)

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) NewsDigestBot/1.0'}

          # 1a. Fetch RSS for latest headline link
          rss_req = urllib.request.Request('https://feeds.bbci.co.uk/news/world/rss.xml', headers=headers)
          with urllib.request.urlopen(rss_req) as resp:
              root = ET.fromstring(resp.read())
          item = root.find('.//channel/item')
          title = item.find('title').text.strip()
          link = item.find('link').text.strip()

          # 1b. Fetch full article HTML and extract clean paragraphs
          art_req = urllib.request.Request(link, headers=headers)
          with urllib.request.urlopen(art_req) as resp2:
              html_content = resp2.read().decode('utf-8', errors='ignore')

          parser = BBCArticleParser()
          parser.feed(html_content)

          # Extracts top 15 core paragraphs (change to `parser.paragraphs` for the complete article)
          selected_paragraphs = parser.paragraphs[:15]
          full_article = '\n\n'.join(selected_paragraphs)

          with open('/tmp/news.json', 'w') as f:
              json.dump({
                  'title': html.unescape(title),
                  'link': link,
                  'paragraphs_count': len(selected_paragraphs),
                  'full_text': full_article
              }, f)
          PY_EOF

          TITLE=$(jq -r '.title' /tmp/news.json)
          ARTICLE_LINK=$(jq -r '.link' /tmp/news.json)
          ARTICLE_TEXT=$(jq -r '.full_text' /tmp/news.json)

          TODAY_DATE=$(TZ="Asia/Tokyo" date +'%A, %B %d, %Y')

          # 2. Construct Prompt for Gemini API with the FULL article text
          PROMPT=$(cat <<EOF
          Analyze the following complete news article:
          Title: $TITLE
          Article Content:
          $ARTICLE_TEXT

          Break down the text sentence by sentence. For EVERY sentence, provide:
          1. EN: [Original English sentence]
          2. ZH: [Mandarin Chinese translation]
          3. PY: [Hanyu Pinyin with tone marks]
          4. JA: [Natural Japanese translation]
          5. RM: [Hepburn Romaji pronunciation]

          Keep the output in clear plain text, structured clearly per sentence.
          EOF
          )

          # Escape prompt payload safely into JSON using jq with high output token budget
          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{
              parts: [{ text: $prompt }]
            }],
            generationConfig: {
              maxOutputTokens: 8192
            }
          }')

          # 3. Verify API Key and Call Gemini 3.8 Flash
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::AI_API_KEY is empty! Add it under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${AI_API_KEY}" \
            -d "$JSON_PAYLOAD")

          # Check for API error status
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$API_ERROR" ]; then
            echo "::error::Gemini API call failed: $API_ERROR"
            exit 1
          fi

          PARSED_CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -z "$PARSED_CONTENT" ]; then
            echo "::error::Gemini returned empty or blocked content."
            exit 1
          fi

          # 4. Construct Email Body
          BODY=$(cat <<EOF
          📰 DAILY NEWS DIGEST ($TODAY_DATE)
          Original Article: $ARTICLE_LINK

          ========================================
          $PARSED_CONTENT
          ========================================

          Have a great day!
          EOF
          )

          # Export variables with collision-proof delimiter
          EOF_DELIM=$(openssl rand -hex 8)
          echo "TODAY_DATE=$TODAY_DATE" >> $GITHUB_ENV
          {
            echo "EMAIL_BODY<<$EOF_DELIM"
            echo "$BODY"
            echo "$EOF_DELIM"
          } >> $GITHUB_ENV

      - name: Send Email Digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.USER_EMAIL }}
          password: ${{ secrets.EMAIL_APP_PW }}
          subject: "📰 Daily News Line-by-Line Breakdown (${{ env.TODAY_DATE }})"
          to: ${{ secrets.USER_EMAIL }}
          from: "News Digest Bot"
          body: ${{ env.EMAIL_BODY }}
